components:
  schemas:
    ContactType:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
        active:
          type: "boolean"
    Person:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        firstName:
          type: "string"
        middleName:
          type: "string"
        lastName:
          type: "string"
        gender:
          type: "string"
        birthdate:
          type: "string"
          format: "date"
    Contact:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        content:
          type: "string"
        contactType:
          $ref: "#/components/schemas/ContactType"
        person:
          $ref: "#/components/schemas/Person"
        active:
          type: "boolean"
    Feature:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
        active:
          type: "boolean"
    FeatureRequest:
      type: "object"
      properties:
        feature:
          $ref: "#/components/schemas/Feature"
        dateTime:
          type: "string"
          format: "date-time"
        appName:
          type: "string"
        appToken:
          type: "string"
    Role:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type: "string"
        features:
          type: "array"
          items:
            $ref: "#/components/schemas/Feature"
        active:
          type: "boolean"
    RoleRequest:
      type: "object"
      properties:
        role:
          $ref: "#/components/schemas/Role"
        dateTime:
          type: "string"
          format: "date-time"
        appName:
          type: "string"
        appToken:
          type: "string"
    User:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        alias:
          type: "string"
        password:
          type: "string"
        email:
          type: "string"
        active:
          type: "boolean"
        person:
          $ref: "#/components/schemas/Person"
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/Role"
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/Application"
    Application:
      type: "object"
      properties:
        id:
