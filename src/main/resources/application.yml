# Inbound TLS — backbone-rest listens on 8084 over HTTPS.
# Backed by backbone.jks (alias: backbone-rest) signed by PRX Internal CA.
# Outbound trust for all *.tst inter-service calls is covered by
# prx-truststore.jks, which is loaded by HttpClientConfig and referenced
# via spring.ssl.bundle.jks.backbone-rest-security.
server:
  port: ${APP_PORT:8084}
  ssl:
    # Enables HTTPS using the named SSL bundle defined below.
    enabled: true
    bundle: backbone-rest-security
    # Only TLS 1.3 is accepted.
    enabled-protocols: TLSv1.3
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json
    min-response-size: 1024

springdoc:
  swagger-ui:
    url: /api.yaml

spring:
  ssl:
    bundle:
      jks:
        backbone-rest-security:
          key:
            alias: backbone-rest
          keystore:
            # backbone.jks — server identity cert signed by PRX Internal CA (alias: backbone-rest)
            location: classpath:${SSL_KEYSTORE_LOCATION:keystore-no-present}
            password: ${SSL_KEYSTORE_PASSWORD:changeit}
            type: ${SSL_KEYSTORE_TYPE:JKS}
          truststore:
            # prx-truststore.jks — PRX Internal CA root; used to trust outbound *.tst calls
            location: classpath:${SSL_TRUSTSTORE_LOCATION:truststore-no-present}
            password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
            type: ${SSL_TRUSTSTORE_TYPE:JKS}

