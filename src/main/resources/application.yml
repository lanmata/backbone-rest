# Inbound TLS — backbone-rest listens on 8084 over HTTPS.
# Backed by backbone.jks (alias: backbone-rest) signed by PRX Internal CA.
# Outbound trust for all *.tst inter-service calls is covered by
# prx-truststore.jks, which is loaded by HttpClientConfig and referenced
# via spring.ssl.bundle.jks.backbone-rest-security.
server:
  port: ${APP_PORT:8084}
  ssl:
    # Enables HTTPS using the named SSL bundle defined below.
    enabled: true
    bundle: backbone-rest-security
    # Only TLS 1.3 is accepted.
    enabled-protocols: TLSv1.3
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json
    min-response-size: 1024

springdoc:
  # api.yaml (src/main/resources/static/api.yaml) is the hand-maintained contract — see
  # CLAUDE.md's "Mandatory Conventions" #9: update it directly whenever an *Api.java
  # signature changes. Annotation-driven generation is unreliable here regardless: every
  # *Api.java method returns ResponseEntity<?> (convention #3 — status decisions live in
  # *ServiceImpl), and that wildcard erasure means springdoc can't resolve a response body
  # schema from the method signature alone. Rather than leave /v3/api-docs auto-generating
  # an incomplete, unused spec in parallel with the real one (and risk a client rendering
  # that broken doc by mistake), it's switched off explicitly.
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # The only spec Swagger UI ever renders — never /v3/api-docs (disabled above).
    url: /api.yaml
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
  # Since api-docs generation is disabled, these have no effect today, but are set
  # explicitly rather than left to defaults in case api-docs is ever re-enabled.
  show-actuator: false
  default-produces-media-type: application/json
  packages-to-scan: com.umdc.backoffice.v1

app:
  name: backbone-rest
umdc:
  app:
    title: Backbone REST API
    version: 0.0.3
    name: backbone-rest
  logging:
    trace:
      enabled: ${LOGGING_TRACE_ENABLED}
  database-cert: db-root-cert
  security:
    managementAuthenticator:
      keyAlias: ${MCAM_KEY_ALIAS:backbone-rest}
      tokenTtlSeconds: ${MCAM_TOKEN_TTL_SECONDS:3600}
      rotationGracePeriodSeconds: ${MCAM_ROTATION_GRACE_SECONDS:300}
      rateLimitRpm: ${MCAM_RATE_LIMIT_RPM:60}
      keystore:
        location: ${SSL_KEYSTORE_LOCATION:classpath:backbone.jks}
        password: ${SSL_KEYSTORE_PASSWORD:changeit}
        type: JKS
    jwt:
      secret: ${APP_TOKEN_SECRET}
      expirationMs: ${APP_TOKEN_EXPIRATION}
      issuer: ${JWT_ISSUER:backbone-rest}
      audience: ${JWT_AUDIENCE:backbone-rest-client}
    keystore: # backbone.jks — server identity cert signed by PRX Internal CA (alias: backbone-rest)
      location: classpath:${SSL_KEYSTORE_LOCATION:backbone.jks}
      password: ${SSL_KEYSTORE_PASSWORD:changeit}
      type: ${SSL_KEYSTORE_TYPE:JKS}
    truststore: # prx-truststore.jks — PRX Internal CA root for outbound *.tst inter-service calls
      location: classpath:${SSL_TRUSTSTORE_LOCATION:umdc-truststore.jks}
      password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
      type: ${SSL_TRUSTSTORE_TYPE:JKS}
  # SSL keystore and truststore used by KeystoreUtil / HttpClientConfig / SecurityConfig
  management:
    clientRoles: authenticated
    # The environments for the application
  api:
    endpoint: /v1
  report:
    # Directory DocumentServiceImpl writes generated .docx files to. Defaults to
    # the JVM temp dir so it works out of the box in the Linux container; override
    # via REPORT_OUTPUT_DIR if a persistent/shared location is needed.
    output-dir: ${REPORT_OUTPUT_DIR:${java.io.tmpdir}}

# Application specific configurations
log:
  debug: ${LOGGING_TRACE_ENABLED}
logging:
  level:
    org.springframework.cloud.configuration.SSLContextFactory: ERROR

spring:
  # Migrated off the legacy Spring Cloud Bootstrap Context (spring-cloud-starter-bootstrap,
  # spring.cloud.bootstrap.enabled) onto the modern ConfigDataLoader import mechanism — the
  # bootstrap mechanism runs its own separate, nested SpringApplication before the real one,
  # which Spring Boot's AOT processor captures instead of the real application context,
  # producing a native image that crashes with "No qualifying bean of type
  # 'ServletWebServerFactory'". All spring.cloud.vault.*/spring.cloud.config.* properties
  # below are unchanged — they configure the same underlying client classes either way.
  config:
    import: "optional:vault://,optional:configserver:"
  mvc:
    throw-exception-if-no-handler-found: true
  mustache:
    check-template-location: false
  test:
    context:
      failure:
        threshold: 10000000
  main:
    # Allows overriding of bean definitions
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_BOOT_PROFILE_ACTIVE}
  application:
    # The name of the Spring Boot application, taken from the app.name property
    name: ${umdc.app.name}
  cloud:
    # The active profile for the Spring Boot application
    profile: ${SPRING_BOOT_PROFILE_ACTIVE}
    config:
      # The active profile for the Spring Cloud Config
      profile: ${SPRING_BOOT_PROFILE_ACTIVE}
      # The label for the Spring Cloud Config
      label: ${SPRING_CLOUD_CONFIG_LABEL}
      # The URI for the Spring Cloud Config server
      uri: ${CNFS_URI}
      port: ${CNFS_PORT}
      # Enables sending of state for the Spring Cloud Config
      send-state: true
      # TLS for the Spring Cloud Config client HTTP channel.
      # Tells the client to trust the PRX Internal CA, which signs all
      # *.tst certificates including prx-qa.config-server.tst.
      # NOTE: this is resolved at bootstrap time, before Spring beans
      # or SSL bundles are initialised, so it must reference the
      # classpath resource directly rather than via spring.ssl.bundle.
      tls:
        enabled: true
        trust-store: classpath:${SSL_TRUSTSTORE_LOCATION:umdc-truststore.jks}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE:JKS}
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:https://vault.umdc-qa.tst}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:secret}
        default-context: ${spring.application.name}
        profile-separator: /
      ssl:
        trust-store: classpath:${SSL_TRUSTSTORE_LOCATION:umdc-truststore.jks}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE:JKS}
  jpa:
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
        jdbc:
          lob:
            non_contextual_creation: true
    # Defers the initialization of the datasource
    defer-datasource-initialization: true
  ssl:
    bundle:
      jks:
        backbone-rest-security:
          key:
            alias: backbone-rest
          keystore:
            # backbone.jks — server identity cert signed by PRX Internal CA (alias: backbone-rest)
            location: classpath:${SSL_KEYSTORE_LOCATION:backbone.jks}
            password: ${SSL_KEYSTORE_PASSWORD:changeit}
            type: ${SSL_KEYSTORE_TYPE:JKS}
          truststore:
            # prx-truststore.jks — PRX Internal CA root; used to trust outbound *.tst calls
            location: classpath:${SSL_TRUSTSTORE_LOCATION:umdc-truststore.jks}
            password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
            type: ${SSL_TRUSTSTORE_TYPE:JKS}

swagger:
  base-package: 'com.umdc.backoffice.v1'
  api-info:
    title: ${umdc.app.name}
    version: ${umdc.app.version}
    description: ${umdc.app.description}
    contact:
      name: 'Luis Antonio Mata'
      url: 'www.prx.test'
      email: 'luis.antonio.mata@gmail.com'
    cache:
      disabled: true

# TLS configuration for the Eureka HTTP client (RestTemplate transport).
# Uses the PRX Internal CA truststore so outbound calls to *.tst Eureka
# servers pass certificate validation.
eureka:
  client:
    tls:
      enabled: true
      trust-store: classpath:${SSL_TRUSTSTORE_LOCATION:umdc-truststore.jks}
      trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: ${SSL_TRUSTSTORE_TYPE:JKS}
