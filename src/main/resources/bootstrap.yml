app:
  name: backbone-rest
  version: 0.0.2-2023
spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_BOOT_PROFILE_ACTIVE}
  application:
    name: backbone-rest
  cloud:
    config:
      profile: ${SPRING_BOOT_PROFILE_ACTIVE}
      label: ${SPRING_CLOUD_CONFIG_LABEL}
      uri: ${CONFIG_SERVER_URL}
      send-state: true
  jpa:
    defer-datasource-initialization: true
  ssl:
    bundle:
      jks:
        config-server:
          key:
            alias: prx.env-qa-docker
          keystore:
            location: classpath:prx.env-qa-docker.p12
            password: 13515030
            type: PKCS12
server:
  ssl:
    enabled: true
    bundle: config-server
management:
    cloudfoundry:
        enabled: false
