spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: qa
  application:
    name: prx-backbone-rest
  cloud:
    config:
      profile: qa
      label: developer
      uri: qa.prx.test/config-server
      send-state: true
  jpa:
    defer-datasource-initialization: true
  ssl:
    bundle:
      jks:
        config-server:
          key:
            alias: prx.env-qa-docker
          keystore:
            location: classpath:prx.env-qa-docker.p12
            password: 13515030
            type: PKCS12
server:
  ssl:
    enabled: true
    bundle: config-server
management:
    cloudfoundry:
        enabled: false
